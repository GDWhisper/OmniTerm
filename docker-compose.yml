services:
  omniterm:
    build:
      context: .
      # 传分支专属变量给 Dockerfile（默认值适配 main worktree，dev/build 时覆盖）
      # 详见 AGENTS.md "配置统一管理" 规则
      args:
        BRANCH_BINARY_NAME: ${BRANCH_BINARY_NAME:-omniterm}
        DOCKER_PORT: ${DOCKER_PORT:-9077}
    # 端口映射从 .env.local 读（env_file 引入），缺省回落 9077:9077
    ports:
      - "${DOCKER_PORT_MAPPING:-9077:9077}"
    volumes:
      - omniterm-data:/app/data
      - /home:/home:ro
    # 从 .env.local 引入所有分支变量（gitignored，各 worktree 独立）
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=sqlite:/app/data/omniterm.db?mode=rwc
      # JWT_SECRET 不在此处设置：.env.local 若配置了会经 env_file 注入；
      # 否则由服务端自动生成随机密钥（容器内 ~/.omniterm/jwt_secret，重建容器后需重新登录）
      # Docker 默认开启密码验证（BIND_ADDR=0.0.0.0 全网暴露，无鉴权 = 任何人可执行 shell）；
      # 仅在本机可信环境可经 .env.local 设 OMNITERM_AUTH_ENABLED=0 关闭
      - OMNITERM_AUTH_ENABLED=${OMNITERM_AUTH_ENABLED:-1}
      - BIND_ADDR=0.0.0.0:${DOCKER_PORT:-9077}
    restart: unless-stopped

volumes:
  omniterm-data:
