name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '补发 npm publish（版本已发布过 GitHub Release），如 0.2.2'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # ── Build Frontend ──────────────────────────────────────────────
  # tag push 才构建；workflow_dispatch 仅用于 npm 补发，跳过整条构建链
  frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --no-frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Build Backend (matrix) ──────────────────────────────────────
  backend:
    needs: frontend
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get binary name
        id: bin
        shell: bash
        run: |
          BIN=$(cargo metadata --format-version=1 --no-deps | \
                jq -r '.packages[0].targets[] | select(.kind[0]=="bin") | .name')
          echo "name=$BIN" >> "$GITHUB_OUTPUT"

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ steps.bin.outputs.name }}" \
             "omniterm-${{ matrix.platform }}"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/${{ steps.bin.outputs.name }}.exe"
          Compress-Archive -Path $src -DestinationPath "omniterm-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: omniterm-${{ matrix.platform }}
          path: omniterm-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: omniterm-${{ matrix.platform }}
          path: omniterm-${{ matrix.platform }}.zip

  # ── GitHub Release ─────────────────────────────────────────────
  github-release:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: omniterm-*
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            omniterm-*/omniterm-*
            install.sh
            install.ps1
          body_path: .github/release-notes.md

  # ── Docker Publish ──────────────────────────────────────────────
  docker:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - uses: actions/download-artifact@v4
        with:
          name: omniterm-linux-x86_64
          path: .

      - run: chmod +x omniterm-linux-x86_64

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── npm Publish（原生平台分包，esbuild 式）─────────────────────────
  # tag push：github-release 成功后自动发布本次版本
  # workflow_dispatch：补发已存在 Release 的版本（frontend 等被跳过）
  npm-publish:
    needs: github-release
    if: ${{ !cancelled() && (needs.github-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # 解析版本号并校验形如 X.Y.Z（防注入 / 拒绝畸形 ref）
      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "❌ 非法版本号: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release download "v${VERSION}" --repo "$REPO" --pattern 'omniterm-*' --dir assets

      - name: Stage packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/npm-prepare.sh "$VERSION" assets npm-dist

      # 平台包先发、主包后发；已存在的版本跳过（幂等，可安全重跑）
      - name: Publish (idempotent)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm-dist/platform/* npm-dist/main; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "⏭️  $name@$VERSION 已发布，跳过"
            else
              npm publish "$dir" --access public
            fi
          done

