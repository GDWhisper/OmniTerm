# cargo-deny 配置 — 许可证 + 安全公告审计（CI audit job，continue-on-error 不阻塞合并）
# 见 docs/dev/plans/2026-07-24-quality-gates.md §2.2 T06 / R02
# 项目自身许可证: FSL-1.1-MIT（Functional Source License v1.1, MIT fallback）

[graph]
# 不排除任何 crate，全量审计

[licenses]
# 允许的宽松/常见许可证（含项目自身 FSL-1.1-MIT 与递归依赖的常见许可证）
allow = [
    "FSL-1.1-MIT",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
# 置信度阈值：低于此值的不确定许可证将标记为 unlicensed
confidence-threshold = 0.8

[advisories]
# 漏洞公告：默认对已发布公告的 crate 报错
# 忽略已撤回/误报需在此登记 id

[bans]
# 依赖禁用/多重版本策略：使用默认（多版本仅警告）

[sources]
# 仅允许 crates.io 与 crates.io 镜像
unknown-registry = "deny"
unknown-git = "warn"