# cargo-deny 配置 — 许可证 + 安全公告审计（CI audit job，阻塞门禁）
# 见 docs/dev/plans/2026-07-24-quality-gates.md §2.2 T06 / R02
# 项目自身许可证: FSL-1.1-MIT（Functional Source License v1.1, MIT fallback）

[graph]
# 不排除任何 crate，全量审计

[licenses]
# 允许的宽松/常见许可证（含项目自身 FSL-1.1-MIT 与递归依赖的常见许可证）
allow = [
    "FSL-1.1-MIT",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Unicode 数据许可证：wezterm-term（D8 git 依赖）传递引入
    # （finl_unicode / wezterm-bidi 的 "… AND Unicode-DFS-2016"），OSI 批准
    "Unicode-DFS-2016",
    # termwiz → terminfo 0.8（wezterm-term 传递引入）：WTFPL，FSF Free/Libre，
    # 极宽松（近似公有领域）；仅随 wezterm-term 引入，非直接依赖
    "WTFPL",
    "Zlib",
    "CC0-1.0",
    # webpki-roots（reqwest → hyper-rustls 递归依赖）：Mozilla 根证书数据的宽松数据许可证
    "CDLA-Permissive-2.0",
]
# 置信度阈值：低于此值的不确定许可证将标记为 unlicensed
confidence-threshold = 0.8

[advisories]
# 漏洞公告：默认对已发布公告的 crate 报错
# 忽略已撤回/误报需在此登记 id
ignore = [
    # adler ← miniz_oxide 0.4 ← wezterm-term（D8 git 依赖锁 2024 tag，无法独立升级）；
    # 仅"不再维护"通告、非漏洞，功能由 flate2/miniz_oxide 链路内部使用
    { id = "RUSTSEC-2025-0056", reason = "wezterm-term 锁版传递依赖，unmaintained 非漏洞" },
    # paste ← termwiz ← wezterm-term；构建期 proc-macro，仓库归档但功能完备稳定
    { id = "RUSTSEC-2024-0436", reason = "wezterm-term 锁版传递依赖，构建期宏，无运行时风险" },
]

[bans]
# 依赖禁用/多重版本策略：使用默认（多版本仅警告）

[sources]
# 仅允许 crates.io 与 crates.io 镜像
unknown-registry = "deny"
unknown-git = "warn"
# 白名单 git 源：wezterm-term 未发布 crates.io（计划 D8），锁 tag 引入
allow-git = ["https://github.com/wez/wezterm.git"]