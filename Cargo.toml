[package]
name = "omniterm"
version = "0.2.14"
edition = "2024"
license = "FSL-1.1-MIT"
authors = ["GDWhisper"]
description = "Web-based tmux terminal manager — one browser tab to watch and drive your AI coding agents"
repository = "https://github.com/GDWhisper/OmniTerm"
readme = "README.md"
include = ["src/**", "frontend/dist/**", "migrations/**", "/build.rs", "/README.md", "/LICENSE.md"]

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1.43", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
jsonwebtoken = "9"
axum-extra = { version = "0.10", features = ["cookie"] }
time = "0.3"
portable-pty = "0.9"
# VT 模拟器（计划 D8）：wezterm-term 未发布 crates.io，git 依赖锁稳定 tag（MIT）
wezterm-term = { git = "https://github.com/wez/wezterm.git", tag = "20240203-110809-5046fc22" }
futures-util = "0.3"
notify = "8"
async-stream = "0.3"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "env"] }
rust-embed = "8"
which = "7"
agent-client-protocol = "1.2"
regex = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.35"
windows-sys = { version = "0.60", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tokio-test = "0.4"

# Clippy 渐进策略 (docs/dev/plans/2026-07-24-quality-gates.md §3.3)：
# 先以 warn 启用 correctness/suspicious/complexity/perf/style 组，
# CI 与 pre-commit 以 `-- -D warnings` 兜底；清零后可按组升 deny。
[lints.clippy]
correctness = "warn"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
